[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buildco2pro"
version = "0.2.0"
description = "BuildCO2 Pro - upfront embodied carbon (EN 15978 A1-A5) of buildings from IFC or a Revit take-off"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Qianbing Zhang", email = "qianbing.zhang@monash.edu" }]
maintainers = [{ name = "Qianbing Zhang", email = "qianbing.zhang@monash.edu" }]
dependencies = [
  "pydantic>=2.5",
  "openpyxl>=3.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ifc = ["ifcopenshell>=0.8"]
pbix = ["pbixray>=0.3"]
figures = ["matplotlib>=3.8"]
dev = ["pytest>=8", "httpx>=0.27"]
all = ["buildco2pro[ifc,pbix,figures,dev]"]

[project.urls]
Homepage = "https://github.com/qbzhang666/BuildCO2-Pro"
Repository = "https://github.com/qbzhang666/BuildCO2-Pro"
"Sister project (tunnels)" = "https://github.com/qbzhang666/TunCO2-Pro"

[project.scripts]
buildco2pro = "buildco2pro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
buildco2pro = ["data/*.csv", "data/fonts/*", "web/*", "web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
pythonpath = ["src"]
